<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KreatBio · Microbiome Report Portal</title>
<meta name="description" content="Read and understand your microbiome amplicon sequencing report — taxonomy, diversity, and what it means.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071B3A;
  --navy-2:#0C2C4A;
  --navy-soft:#F5F8FC;
  --aqua:#DDF3F2;
  --aqua-2:#EEF9F8;
  --paper:#FFFFFF;
  --card:#FFFFFF;
  --line:#DDE6EF;
  --line-2:#EEF3F8;
  --muted:#5C6B72;
  --muted-2:#7C8A90;
  --ink:#14232B;
  --good:#1F4E7A;
  --bad:#C0455B;
  --warn:#B26A1C;
  --radius:8px;
  --radius-sm:6px;
  --shadow-1:0 8px 26px -22px rgba(7,27,58,.45);
  --shadow-2:0 24px 60px -40px rgba(7,27,58,.55);
  --ease:cubic-bezier(.22,.61,.36,1);
  --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --sans:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  min-height:100vh;
  background:#F8FBFE;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--navy);text-decoration:none}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}

/* ---------- brand ---------- */
.brand{display:inline-flex;align-items:baseline;gap:.5px;font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1;letter-spacing:-.2px}
.brand .k{color:var(--navy)}
.brand .b{color:var(--navy-2)}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--navy-2);align-self:center;margin:0 2px}
.brand-logo{display:block;width:142px;height:auto;position:relative;z-index:1}
.topbar .brand-logo{width:116px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-weight:600;line-height:1;white-space:nowrap;border:1px solid transparent;transition:transform .15s var(--ease),background .18s,border-color .18s,color .18s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-teal{background:var(--navy);color:#fff}
.btn-teal:hover{background:var(--navy-2)}
.btn-ghost{border-color:var(--line);background:var(--card);color:var(--navy)}
.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-sm{min-height:34px;padding:0 12px;font-size:.82rem;border-radius:6px}
.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--navy)}
.icon-btn:hover{border-color:var(--navy);color:var(--navy)}

/* ================= GATE ================= */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.gate-visual{position:relative;overflow:hidden;background:linear-gradient(160deg,#06182F 0%,#0A2340 46%,#0C2C4A 100%);color:#EEF3F8;display:flex;flex-direction:column;padding:36px clamp(28px,4vw,64px)}
.gate-visual .brand .k{color:#fff}
.gate-visual .brand .b{color:#DCE9F7}
#petri{position:absolute;inset:0;width:100%;height:100%;display:block}
.gate-copy{position:relative;margin:auto 0;min-height:80%;width:min(620px,92%);max-width:none;padding:clamp(28px,4.5vw,56px);border-radius:12px;background:rgba(0,0,0,.48);display:flex;flex-direction:column;justify-content:center}
.gate-copy .micro-kicker{color:#DCE9F7;font-size:clamp(.9rem,1.2vw,1.1rem);font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.gate-copy h1{margin-top:0;font-family:var(--display);font-weight:800;font-size:clamp(3rem,6vw,5.2rem);line-height:1.02;letter-spacing:-1px}
.gate-copy .micro-kicker+h1{margin-top:18px}
.gate-copy h1 em{font-style:italic;color:#DCE9F7}
.gate-copy p{margin-top:18px;color:#C5D4E3;font-size:1.05rem;max-width:46ch}
.gate-form{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px clamp(24px,4vw,64px);background:var(--paper)}
.gate-form-logo{width:min(430px,100%);margin:0 auto 28px;display:flex;justify-content:center}
.gate-form-logo .brand-logo{width:170px}
.access-card{width:min(430px,100%);margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:32px;text-align:center}
.access-card h2{font-size:1.4rem;color:var(--navy);line-height:1.2}
.access-card .lead{margin-top:8px;color:var(--muted)}
.cta-demo{margin-top:22px;width:100%}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted-2);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.field label{display:block;font-weight:600;font-size:.82rem;color:var(--navy);margin-bottom:8px;text-align:center}
.code-row{display:flex;gap:10px}
.code-row input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;color:var(--navy);background:var(--paper)}
.code-row input:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(7,27,58,.14)}
.gate-status{min-height:20px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.gate-status.err{color:var(--bad)}
.gate-note{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted-2);line-height:1.5}

/* ================= APP ================= */
.app{display:none;background:#F8FBFE}
.app.on{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;height:76px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topbar-in{height:100%;display:grid;grid-template-columns:292px minmax(0,1fr) auto;align-items:center;gap:18px;padding:0 28px}
.top-l,.top-r,.top-center{display:flex;align-items:center;gap:14px;min-width:0}
.top-center{justify-content:center}
.report-chip,.assay-chip{display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:.86rem;font-weight:700;color:var(--navy);box-shadow:0 1px 2px rgba(7,27,58,.03)}
.assay-chip .badge-live{font-size:.62rem;letter-spacing:.12em;font-weight:700;color:var(--muted-2);background:none;padding:0;text-transform:uppercase}
.assay-chip select{border:none;background:none;font-weight:700;color:var(--navy);cursor:pointer;max-width:30vw;text-overflow:ellipsis}
.top-help{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;color:var(--navy);background:#fff}
.avatar{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1F5CA8;color:#fff;font-weight:800}
.client-menu{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);font-size:.86rem}

.shell{display:grid;grid-template-columns:292px 1fr;align-items:start}
.rail{position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;border-right:1px solid var(--line);padding:24px 22px;background:#fff;display:flex;flex-direction:column}
.rail-head{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;padding:0 0 14px}
.rail-badge{width:38px;height:38px;border-radius:9px;background:var(--navy);display:grid;place-items:center;color:#fff}
.rail-head .r-title{font-family:var(--display);font-size:.94rem;font-weight:800;letter-spacing:-.2px;color:var(--navy)}
.rail-head .r-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.progress-wrap{margin:8px 0 22px}
.progress-track{height:6px;border-radius:999px;background:#D6E0EA;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#0E8F98,#1F5CA8);border-radius:999px;transition:width .5s var(--ease)}
.progress-label{margin-top:10px;font-size:.78rem;color:var(--navy)}
.nav{display:grid;gap:7px}
.nav-sec{display:none}
.nav-item{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:13px;padding:11px 12px;border-radius:8px;text-align:left;color:var(--navy);border:1px solid transparent;position:relative}
.nav-item:hover{background:#F6FAFC}
.nav-item.on{background:linear-gradient(90deg,#EAF8F7,#F7FBFE);border-color:#B9E4E2;box-shadow:none}
.nav-item.on::before{content:"";position:absolute;left:-22px;top:8px;bottom:8px;width:4px;border-radius:999px;background:#0E8F98}
.nav-item .n-ic{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:none;color:var(--navy)}
.nav-item.on .n-ic{background:none;color:#0E8F98}
.nav-item b{display:block;font-size:.9rem;font-weight:600;line-height:1.15}
.nav-item small{display:block;font-size:.73rem;color:var(--muted);margin-top:1px}
.nav-item .n-check,.nav-num{display:none}
.rail-help{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;color:var(--navy)}
.rail-help .top-help{width:34px;height:34px}
.rail-help b{font-size:.86rem}
.rail-help span{display:block;font-size:.76rem;color:var(--muted)}

.main{min-width:0;padding:22px clamp(20px,3vw,44px) 80px}
.content{max-width:1280px;margin:0 auto}
.section-head{margin-bottom:22px}
.section-head .kicker{display:flex;align-items:center;gap:10px}
.section-head h1{margin-top:10px;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,3.1vw,2.7rem);line-height:1.1;color:var(--navy);letter-spacing:-.8px}
.section-head .dek{margin-top:12px;max-width:66ch;font-size:1.06rem;color:var(--muted)}

/* generic blocks */
.card,.viz{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1)}
.pad{padding:clamp(18px,2.2vw,26px)}
.stack{display:grid;gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow-1)}
.stat .s-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .s-val{margin-top:7px;font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:-.5px;color:var(--navy);line-height:1}
.stat .s-note{margin-top:6px;font-size:.78rem;color:var(--muted-2)}
.stat-list{display:grid;gap:12px;margin-bottom:20px}
.stat-line{
  display:grid;
  grid-template-columns:160px minmax(0,1fr);
  gap:16px;
  align-items:baseline;
  padding:0 0 12px;
  border-bottom:1px solid var(--line-2);
}
.stat-line:last-child{border-bottom:0}
.stat-line .s-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat-line .s-val{font-family:var(--display);font-size:1rem;font-weight:700;color:var(--navy);line-height:1.25}
.stat-line .s-note{display:block;margin-top:3px;font-size:.78rem;color:var(--muted-2);font-weight:400}
.welcome-flow{display:grid;gap:30px}
.welcome-block{padding-top:26px;border-top:1px solid var(--line-2)}
.welcome-block:first-child{padding-top:0;border-top:0}
.welcome-block .eyebrow{margin-bottom:16px}
.statref{margin-top:12px}
.sr-scale{position:relative;height:6px;border-radius:999px;background:var(--line);margin:16px 0 7px}
.sr-track{position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,#F5F8FC,#DDE6EF)}
.sr-thresh{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted-2)}
.sr-thresh span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted-2);white-space:nowrap}
.sr-marker{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid #fff;box-shadow:0 0 0 1px var(--navy);transform:translate(-50%,-50%)}
.sr-ends{display:flex;justify-content:space-between;gap:10px;font-size:.66rem;color:var(--muted-2)}
.sr-ends span:last-child{text-align:right}
.sr-interp{margin-top:8px;font-size:.8rem;color:var(--muted);line-height:1.45}

.readbox{border:none;border-left:2px solid var(--navy);border-radius:0;background:none;padding:1px 0 1px 16px}
.readbox h4{display:flex;align-items:center;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy)}
.readbox p{margin-top:8px;color:var(--ink);font-size:.94rem}
.readbox p+p{margin-top:7px}
.limitbox{border:none;border-left:2px solid var(--warn);border-radius:0;background:none;padding:1px 0 1px 16px}
.limitbox h4{display:flex;align-items:center;gap:8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn)}
.limitbox p{margin-top:7px;color:var(--muted);font-size:.9rem}

/* technical detail styling (visibility handled in JS render) */

/* chart chrome */
.viz{overflow:visible;padding:18px}
.viz-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 0 14px;border-bottom:1px solid var(--line-2);background:none}
.viz-bar .v-title{font-weight:600;color:var(--navy)}
.viz-bar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{padding:7px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.seg.small button{padding:6px 10px;font-size:.76rem}
.viz-body{padding:16px 0 0}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px}
.legend button{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);padding:3px 6px;border-radius:8px}
.legend button:hover{background:var(--line-2)}
.legend button.dim{opacity:.32}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.axis-note{margin-top:10px;font-size:.78rem;color:var(--muted-2)}

/* overview screen */
.overview-hero{position:relative;min-height:168px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:url("client_supplements/1_starthere_1.png") right center/cover no-repeat;display:flex;align-items:center;padding:30px 36px}
.overview-hero h1{max-width:540px;font-size:clamp(2.1rem,3vw,3rem);line-height:1.08;color:var(--navy);letter-spacing:-.8px}
.overview-hero p{margin-top:12px;color:var(--navy);font-size:.98rem}
.overview-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.overview-stat-card{display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;min-height:132px;box-shadow:var(--shadow-1)}
.overview-icon{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),#F7FBFE);display:grid;place-items:center;color:#0E8F98}
.overview-icon .icon{width:30px;height:30px;stroke-width:1.8}
.overview-stat-card .overview-icon{background:var(--navy);color:#fff}
.overview-stat-card b{display:block;font-size:.9rem;color:var(--navy)}
.overview-stat-card strong{display:block;margin-top:4px;font-size:1.35rem;line-height:1.15;color:var(--navy)}
.overview-stat-card span{display:block;margin-top:10px;color:var(--muted);font-size:.82rem;line-height:1.45}
.overview-stat-card > div:last-child,.learn-card > div:last-child{min-width:0}
.overview-callout{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:18px;margin-top:18px;padding:0 22px 0 0;border:1px solid #B9E4E2;border-radius:12px;background:linear-gradient(90deg,#F0FBFA,#F8FCFF);overflow:hidden}
.guide-avatar{align-self:stretch;min-height:82px;background:url("client_supplements/1_starthere_2.png") center 20%/cover no-repeat}
.overview-callout h3{font-size:1.2rem;color:var(--navy)}
.overview-callout p{margin-top:4px;color:var(--muted)}
.learn-title{margin:20px 0 10px;font-size:1.18rem;color:var(--navy)}
.learn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.learn-card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;min-height:96px}
.learn-card b{display:block;color:var(--navy);font-size:.9rem;line-height:1.25}
.learn-card span{display:block;margin-top:5px;color:var(--muted);font-size:.8rem;line-height:1.4}
.detail-panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.detail-panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}
.detail-panel-head b{color:var(--navy)}
.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.detail-item{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;padding:4px 18px;border-left:1px solid var(--line)}
.detail-item:first-child{border-left:0;padding-left:0}
.detail-item .icon{color:var(--navy)}
.detail-item span{display:block;font-size:.72rem;color:var(--muted)}
.detail-item b{display:block;margin-top:2px;color:var(--navy);font-size:.88rem}
.overview-actions{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap}
.overview-actions .btn{min-width:230px}

.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s;background:var(--navy);color:#fff;padding:8px 11px;border-radius:7px;font-size:.78rem;line-height:1.4;box-shadow:0 12px 30px -14px rgba(0,0,0,.6);max-width:240px}
.tip.on{opacity:1;transform:translateY(0)}
.tip b{color:#DCE9F7}

/* assay cards */
.assay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.assay-card{border:1px solid var(--line);border-radius:8px;padding:16px;background:none;transition:border-color .18s}
.assay-card.active{border-color:var(--navy);background:var(--navy-soft)}
.assay-card .a-tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.assay-card h4{margin-top:8px;font-size:1.05rem;color:var(--navy)}
.assay-card .a-region{margin-top:4px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.assay-card .assay-note{margin-top:12px;color:var(--muted);font-size:.86rem;line-height:1.45}
.assay-card ul{margin-top:12px;list-style:none;display:grid;gap:7px}
.assay-card li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:.85rem;color:var(--ink)}
.assay-card li svg{margin-top:3px}
.assay-card .use-btn{margin-top:14px;width:100%}

/* pipeline */
.pipe{display:grid;grid-template-columns:1fr;gap:0}
.pipe-track{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;margin-bottom:6px}
.pipe-step{position:relative;text-align:center;padding:10px 4px 4px}
.pipe-step .dot{width:38px;height:38px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);color:var(--muted);position:relative;z-index:2;transition:all .2s}
.pipe-step.on .dot{border-color:var(--navy);background:var(--navy);color:#fff;transform:scale(1.06)}
.pipe-step.past .dot{border-color:var(--navy);color:var(--navy)}
.pipe-step .p-num{font-family:var(--mono);font-size:.68rem;color:var(--muted-2);margin-bottom:4px}
.pipe-step .p-name{margin-top:8px;font-size:.74rem;font-weight:600;color:var(--navy);line-height:1.2}
.pipe-line{position:absolute;top:33px;left:0;right:0;height:2px;background:var(--line);z-index:1}
.pipe-line-fill{position:absolute;top:33px;left:0;height:2px;background:var(--navy);z-index:1;transition:width .4s var(--ease)}
.pipe-detail{margin-top:14px;border:none;border-top:1px solid var(--line-2);border-radius:0;overflow:hidden;background:none}
.pipe-detail-in{display:grid;grid-template-columns:150px 1fr;gap:0}
.pipe-glyph{background:none;display:grid;place-items:center;border-right:1px solid var(--line-2);padding:16px 16px 16px 0}
.pipe-text{padding:18px 0 4px 20px}
.pipe-text .p-tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.pipe-text h3{margin-top:6px;font-size:1.15rem;color:var(--navy)}
.pipe-text p{margin-top:9px;color:var(--muted);max-width:60ch}
.pipe-text .tech{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.pipe-text .tech .p-tag{color:var(--navy)}
.pipe-nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* file guide */
.file-row{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.file-row:last-child{border-bottom:none}
.file-name{font-family:var(--mono);font-size:.86rem;color:var(--navy);font-weight:600;word-break:break-word}
.file-kind{margin-top:5px;display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);background:none;padding:0}
.file-def{display:grid;gap:10px}
.file-def .fd{display:grid;grid-template-columns:120px 1fr;gap:12px}
.file-def dt{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.file-def dd{font-size:.88rem;color:var(--ink)}
.file-viz{margin-top:12px}
.file-right{min-width:0}
.file-extra{margin-top:16px;padding:14px 16px;border:1px solid var(--line-2);border-radius:8px;background:var(--navy-soft)}
.file-extra h5{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--navy);font-weight:700}
.file-extra .fx-guide{margin-top:5px;font-size:.78rem;color:var(--muted);max-width:66ch}
.fx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.fx-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:7px;padding:11px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);transition:border-color .15s,color .15s,background .15s}
.fx-item:hover{border-color:var(--navy);color:var(--navy);background:#fff}
.fx-ic{width:22px;height:22px}
.fx-item span{font-size:.72rem;line-height:1.2}
@media (max-width:760px){.fx-grid{grid-template-columns:repeat(2,1fr)}}

/* glossary */
.glossary-search{width:100%;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:.95rem}
.glossary-search:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(7,27,58,.12)}
.term{padding:16px 0;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:none}
.term b{color:var(--navy);font-size:.98rem}
.term .t-tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-left:8px}
.term p{margin-top:6px;color:var(--muted);font-size:.9rem;max-width:78ch}

/* footer / next */
.next-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.next-bar .n-hint{font-size:.82rem;color:var(--muted)}
.disclaimer{margin-top:34px;font-size:.78rem;color:var(--muted-2);line-height:1.6;max-width:80ch}

/* pill row */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line-2);border-radius:999px;font-size:.8rem;color:var(--muted);background:none}
.pill b{color:var(--navy)}

.menu-btn{display:none}
@media (max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .assay-grid{grid-template-columns:1fr}
  .overview-stats,.learn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .detail-item{border-left:0;padding:4px 0}
  .topbar-in{grid-template-columns:240px minmax(0,1fr) auto;padding:0 18px}
  .client-menu{display:none}
  .pipe-detail-in{grid-template-columns:1fr}
  .pipe-glyph{border-right:none;border-bottom:1px solid var(--line)}
}
@media (max-width:920px){
  .topbar{height:64px}
  .topbar-in{grid-template-columns:auto 1fr auto}
  .top-center{justify-content:flex-start}
  .report-chip{display:none}
  .avatar{display:none}
  .gate{grid-template-columns:1fr}
  .gate-visual{min-height:42vh}
  .gate-copy{min-height:70%;width:100%}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:64px;z-index:45;width:min(320px,86vw);height:calc(100vh - 64px);transform:translateX(-104%);box-shadow:var(--shadow-2);transition:transform .22s var(--ease)}
  .rail.open{transform:none}
  .menu-btn{display:inline-grid}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .file-row{grid-template-columns:1fr;gap:10px}
  .pipe-track{grid-template-columns:repeat(7,1fr)}
  .pipe-step .p-name{display:none}
  .overview-hero{padding:26px 24px}
  .overview-callout{grid-template-columns:1fr}
  .guide-avatar{display:none}
}
@media (max-width:560px){
  .topbar-in{padding:0 10px;gap:8px}
  .topbar .brand-logo{width:104px}
  .top-r{display:none}
  .main{padding:22px 12px 80px}
  .content{max-width:100%}
  .grid-4{grid-template-columns:1fr 1fr}
  .overview-stats,.learn-grid,.detail-grid{grid-template-columns:1fr}
  .overview-hero,.overview-stat-card,.overview-callout,.learn-card,.detail-panel{width:100%;max-width:100%;min-width:0}
  .overview-stat-card,.learn-card{grid-template-columns:52px minmax(0,1fr);padding:18px 16px}
  .overview-stat-card strong,.overview-stat-card span,.learn-card b,.learn-card span{overflow-wrap:anywhere}
  .overview-icon{width:48px;height:48px}
  .overview-actions .btn{width:100%;min-width:0}
  .overview-hero{min-height:190px;padding:24px;background:url("client_supplements/1_starthere_1.png") center/cover no-repeat}
  .overview-hero h1{max-width:100%;font-size:2rem;line-height:1.08}
  .file-def .fd{grid-template-columns:1fr}
  .assay-chip{max-width:none;width:150px;padding:0 10px}
  .assay-chip select{max-width:128px}
  .assay-chip label,.assay-chip .icon{display:none}
  .top-r .btn span{display:none}
  .top-help{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

function petri(){
  var c=$("#petri");if(!c)return;var ctx=c.getContext("2d");var dots=[];var raf;
  var cols=["#E8833A","#4B6FA6","#C0455B","#6C6BC4","#E0B93C","#4B7BD6","#7FD1CB"];
  function size(){var r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);build(r.width,r.height);}
  function build(w,h){dots=[];var n=Math.min(120,Math.round(w*h/6500));for(var i=0;i<n;i++){dots.push({x:Math.random()*w,y:Math.random()*h,r:1.5+Math.random()*3.5,c:cols[i%cols.length],vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,a:.25+Math.random()*.5});}}
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function frame(){var r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
    for(var i=0;i<dots.length;i++){var d=dots[i];d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>r.width)d.vx*=-1;if(d.y<0||d.y>r.height)d.vy*=-1;
      for(var j=i+1;j<dots.length;j++){var e=dots[j];var dx=d.x-e.x,dy=d.y-e.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<64){ctx.globalAlpha=(1-dist/64)*.10;ctx.strokeStyle="#DCE9F7";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(e.x,e.y);ctx.stroke();}}}
    for(var k=0;k<dots.length;k++){var p=dots[k];ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.fill();}
    ctx.globalAlpha=1;if(!reduce)raf=requestAnimationFrame(frame);}
  size();frame();window.addEventListener("resize",size);
}

/* ---------------- SECTION: taxonomy ---------------- */
var taxState={level:"genus",focus:null};
function secTaxonomy(){
  var d=ds();
  var dek=d.kind==="fungi"?"Which fungi were detected, and in what proportion. Each bar is one sample.":"Which bacteria were detected, and in what proportion. Each bar is one sample.";
  var html=head("Composition","Who Is There",dek);
  html+='<div class="viz" id="tax-viz"><div class="viz-bar">'+
    '<span class="v-title">Relative abundance by sample</span>'+
    '<div class="seg small" id="tax-level"><button data-level="phylum">Phylum</button><button data-level="genus" class="on">Genus</button></div>'+
    '<span class="spacer"></span>'+
    '<span class="pill" style="font-size:.76rem">Sorted by group</span>'+
    '</div><div class="viz-body"><div id="tax-chart"></div><div class="legend" id="tax-legend"></div>'+
    '<div class="axis-note">Bars sum to 100%. Low-abundance taxa are pooled into <b>Other</b>. Click a colour to trace one taxon across all samples.</div></div></div>';

  var top=topShift(d);
  html+='<div class="grid-2" style="margin-top:20px">'+
    readbox("How to read this",
      "<p>Same colour is always the same taxon, so you can scan across samples. Here, "+esc(top.up)+" rises in the "+esc(top.groupUp)+" group while "+esc(top.down)+" drops.</p>")+
    limitbox("<p>Proportions are relative: if one taxon booms, the rest look smaller. \"Other\" pools low-abundance taxa.</p>")+
  '</div>';
  html+=nextBar();
  return html;
}
function topShift(d){
  var best={taxon:"",group:"",value:-1},lowest={taxon:"",value:Infinity};
  d.genera.forEach(function(taxon){
    if(taxon==="Other"){return;}
    var groupMeans=d.groups.map(function(g){
      var vals=d.samples.filter(function(s){return s.group===g.id;}).map(function(s){return s.fr[taxon]||0;});
      return {group:g.label,value:vals.reduce(function(a,b){return a+b;},0)/(vals.length||1)};
    });
    groupMeans.forEach(function(m){if(m.value>best.value){best={taxon:taxon,group:m.group,value:m.value};}});
    var mean=groupMeans.reduce(function(a,m){return a+m.value;},0)/(groupMeans.length||1);
    if(mean>0&&mean<lowest.value){lowest={taxon:taxon,value:mean};}
  });
  return {up:best.taxon||d.genera[0],groupUp:best.group||d.groups[0].label,down:lowest.taxon||"low-abundance taxa"};
}
function taxAggregate(d,level){
  var keys=[],map={};
  d.samples.forEach(function(s){
    var agg={};
    for(var g in s.fr){var key=level==="phylum"?GENUS_PHYLUM[g]:g;agg[key]=(agg[key]||0)+s.fr[g];}
    map[s.id]=agg;
    for(var k in agg)if(keys.indexOf(k)<0)keys.push(k);
  });
  // order keys by overall mean desc, Other last
  var mean={};keys.forEach(function(k){var t=0;d.samples.forEach(function(s){t+=map[s.id][k]||0;});mean[k]=t;});
  keys.sort(function(a,b){if(a==="Other")return 1;if(b==="Other")return -1;return mean[b]-mean[a];});
  return {keys:keys,map:map};
}
function colorFor(level,key){return level==="phylum"?(PHYLUM_COLOR[key]||"#9AA7AE"):(GENUS_COLOR[key]||"#9AA7AE");}
function renderTaxChart(){
  var d=ds();var level=taxState.level;var agg=taxAggregate(d,level);
  var samples=d.samples;var n=samples.length;
  var W=980,H=380,padL=42,padB=52,padT=14,padR=14;
  var plotW=W-padL-padR,plotH=H-padT-padB;
  var gap=10,groupGap=26;
  // compute x positions with group gaps
  var xs=[],x=padL;var prevGroup=null;var barW=(plotW-((n-1)*gap)-groupGap)/n;
  samples.forEach(function(s){if(prevGroup!==null&&s.group!==prevGroup)x+=groupGap;xs.push(x);x+=barW+gap;prevGroup=s.group;});
  var svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Stacked bar chart of taxonomic composition per sample">';
  // y axis grid
  [0,25,50,75,100].forEach(function(t){var yy=padT+plotH-(t/100*plotH);svg+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#EEF4F2"/><text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#7C8A90">'+t+'</text>';});
  samples.forEach(function(s,i){
    var xx=xs[i];var yTop=padT;
    agg.keys.forEach(function(k){
      var v=agg.map[s.id][k]||0;if(v<=0)return;var hh=v*plotH;
      var dim=taxState.focus&&taxState.focus!==k?' opacity="0.18"':'';
      svg+='<rect class="tax-seg" data-sample="'+esc(s.id)+'" data-taxon="'+esc(k)+'" data-val="'+(v*100).toFixed(1)+'" x="'+xx+'" y="'+yTop+'" width="'+barW+'" height="'+hh+'" fill="'+colorFor(level,k)+'"'+dim+' rx="1"/>';
      yTop+=hh;
    });
    svg+='<text x="'+(xx+barW/2)+'" y="'+(padT+plotH+16)+'" text-anchor="middle" font-size="11" fill="#14232B" font-family="monospace">'+esc(s.id)+'</text>';
  });
  // group labels
  var groups=d.groups;var byGroup={};samples.forEach(function(s,i){(byGroup[s.group]=byGroup[s.group]||[]).push(xs[i]);});
  groups.forEach(function(g){var arr=byGroup[g.id];if(!arr)return;var cx=(arr[0]+arr[arr.length-1]+barW)/2;svg+='<text x="'+cx+'" y="'+(padT+plotH+38)+'" text-anchor="middle" font-size="12" font-weight="600" fill="'+g.color+'">'+esc(g.label)+'</text>';});
  svg+='<text x="'+(padL-30)+'" y="'+(padT+plotH/2)+'" transform="rotate(-90 '+(padL-30)+' '+(padT+plotH/2)+')" text-anchor="middle" font-size="11" fill="#7C8A90">Relative abundance (%)</text>';
  svg+='</svg>';
  $("#tax-chart").innerHTML=svg;
  // legend
  $("#tax-legend").innerHTML=agg.keys.map(function(k){
    var dim=taxState.focus&&taxState.focus!==k?" dim":"";
    return '<button class="leg'+dim+'" data-taxon="'+esc(k)+'"><i style="background:'+colorFor(level,k)+'"></i>'+esc(k)+'</button>';
  }).join("");
  wireTaxEvents();
}
function wireTaxEvents(){
  $$(".tax-seg").forEach(function(r){
    r.addEventListener("mousemove",function(e){showTip('<b>'+esc(r.dataset.taxon)+'</b><br>Sample '+esc(r.dataset.sample)+' · '+r.dataset.val+'%',e.clientX,e.clientY);});

/* ---------------- SECTION: alpha ---------------- */
var alphaState={metric:"shannon"};
function secAlpha(){
  var d=ds();
  var html=head("Diversity","Within Samples",
    "How rich and even a single sample is. More types, more evenly spread, means higher diversity.");
  var metrics=d.alphaMetrics;
  html+='<div class="viz"><div class="viz-bar"><span class="v-title">Alpha diversity by group</span>'+
    '<div class="seg small" id="alpha-metric">'+metrics.map(function(m){return '<button data-metric="'+m.id+'"'+(m.id===alphaState.metric?' class="on"':'')+'>'+esc(m.label)+'</button>';}).join("")+'</div>'+
    '<span class="spacer"></span></div>'+
    '<div class="viz-body"><div id="alpha-chart"></div><div class="axis-note" id="alpha-note"></div></div></div>';
  html+='<div class="grid-2" style="margin-top:20px">'+
    '<div id="alpha-read"></div>'+
    limitbox("<p>A diversity number is a summary, not a diagnosis. It depends on read depth, so samples are levelled to equal depth first.</p>")+
  '</div>';
  html+=nextBar();
  return html;
}
function alphaVal(s,metric){if(metric==="shannon")return s.shannon;if(metric==="observed")return s.observed;if(metric==="simpson")return s.simpson;if(metric==="faith")return s.faith;return 0;}
function renderAlpha(){
  var d=ds();var metric=alphaState.metric;
  if(metric==="faith"&&d.kind==="fungi")metric="shannon",alphaState.metric="shannon";
  var groups=d.groups;
  var vals=d.samples.map(function(s){return {s:s,v:alphaVal(s,metric)};}).filter(function(o){return o.v!=null;});
  var min=Math.min.apply(null,vals.map(function(o){return o.v;}));
  var max=Math.max.apply(null,vals.map(function(o){return o.v;}));
  var pad=(max-min)*0.2||1;min-=pad;max+=pad;if(metric!=="shannon")min=Math.max(0,min);
  var W=760,H=340,padL=54,padB=54,padT=16,padR=20;var plotW=W-padL-padR,plotH=H-padT-padB;
  function y(v){return padT+plotH-((v-min)/(max-min))*plotH;}
  var colW=plotW/groups.length;
  var svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Alpha diversity strip plot">';
  // y ticks
  for(var t=0;t<=4;t++){var vv=min+(max-min)*t/4;var yy=y(vv);svg+='<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="#EEF4F2"/><text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#7C8A90">'+(metric==="observed"?Math.round(vv):vv.toFixed(1))+'</text>';}
  var means={};
  groups.forEach(function(g,gi){
    var gx=padL+colW*gi+colW/2;
    var gv=vals.filter(function(o){return o.s.group===g.id;});
    var m=gv.reduce(function(a,o){return a+o.v;},0)/gv.length;means[g.id]=m;
    // mean bar
    svg+='<line x1="'+(gx-42)+'" y1="'+y(m)+'" x2="'+(gx+42)+'" y2="'+y(m)+'" stroke="'+g.color+'" stroke-width="2.5"/>';
    svg+='<text x="'+gx+'" y="'+y(m)+'" dy="-8" text-anchor="middle" font-size="11" font-weight="600" fill="'+g.color+'">mean '+(metric==="observed"?Math.round(m):m.toFixed(2))+'</text>';
    // jittered dots
    gv.forEach(function(o,i){var jx=gx-26+((i*17)%52);svg+='<circle class="alpha-dot" data-s="'+esc(o.s.id)+'" data-v="'+(metric==="observed"?Math.round(o.v):o.v.toFixed(2))+'" cx="'+jx+'" cy="'+y(o.v)+'" r="6" fill="'+g.color+'" fill-opacity="0.55" stroke="'+g.color+'" stroke-width="1.5"/>';});
    svg+='<text x="'+gx+'" y="'+(padT+plotH+24)+'" text-anchor="middle" font-size="12" font-weight="600" fill="'+g.color+'">'+esc(g.label)+'</text>';
    svg+='<text x="'+gx+'" y="'+(padT+plotH+40)+'" text-anchor="middle" font-size="10.5" fill="#7C8A90">n='+gv.length+'</text>';
  });
  svg+='</svg>';
  $("#alpha-chart").innerHTML=svg;
  $$(".alpha-dot").forEach(function(dt){dt.addEventListener("mousemove",function(e){showTip('Sample <b>'+esc(dt.dataset.s)+'</b><br>value '+dt.dataset.v,e.clientX,e.clientY);});dt.addEventListener("mouseleave",hideTip);});
  var mlabel=d.alphaMetrics.filter(function(m){return m.id===metric;})[0].label;
  $("#alpha-note").innerHTML="Each dot is one sample. The bar marks the group mean for <b>"+esc(mlabel)+"</b>. Wider vertical spread = more variable samples.";
  // interpretation
  var ranked=groups.slice().sort(function(a,b){return means[b.id]-means[a.id];});
  var hi=ranked[0],lo=ranked[ranked.length-1];
  var denom=(means[hi.id]+means[lo.id])/2||1;
  var pct=Math.abs(means[hi.id]-means[lo.id])/denom*100;
  var body="<p>The <strong>"+esc(hi.label)+"</strong> group has the highest mean "+esc(mlabel)+" and <strong>"+esc(lo.label)+"</strong> has the lowest in this report — about "+pct.toFixed(0)+"% apart.</p>"+
    "<p>These values are read from <code>alpha_diversity.tsv</code>; interpret them together with read depth, group size, and the PERMANOVA/PERMDISP results.</p>";
  $("#alpha-read").innerHTML=readbox("What this is telling you",body);
}

/* ---------------- SECTION: beta ---------------- */
var betaState={metric:"bray"};
function secBeta(){
  var d=ds();
  if(d.betaMetrics.map(function(m){return m.id;}).indexOf(betaState.metric)<0)betaState.metric=d.betaMetrics[0].id;
  var html=head("Diversity","Between Samples",
    "How different two samples are overall. Each sample is a point; closer points mean more similar communities.");
  html+='<div class="viz"><div class="viz-bar"><span class="v-title">Ordination (PCoA)</span>'+
    (d.betaMetrics.length>1?'<div class="seg small" id="beta-metric">'+d.betaMetrics.map(function(m){return '<button data-metric="'+m.id+'"'+(m.id===betaState.metric?' class="on"':'')+'>'+esc(m.label)+'</button>';}).join("")+'</div>':'<span class="pill" style="font-size:.76rem">'+esc(d.betaMetrics[0].label)+'</span>')+
    '<span class="spacer"></span></div>'+
    '<div class="viz-body"><div id="beta-chart"></div><div class="axis-note" id="beta-note"></div></div></div>';
  html+='<div class="grid-3" id="beta-stats" style="margin-top:20px"></div>';
  html+='<div class="grid-2" style="margin-top:20px">'+
    '<div id="beta-read"></div>'+
    limitbox("<p>PCoA compresses many dimensions onto two, so the axis percentages show how much you are seeing. A low p-value means the groups differ, not why.</p>")+
  '</div>';
  html+=nextBar();
  return html;
}
function renderBeta(){
  var d=ds();var metric=betaState.metric;var pm=d.permanova[metric];var groups=d.groups;
  var pts=d.samples.map(function(s){return {s:s,x:s.pco[metric][0],y:s.pco[metric][1]};});
  var xs=pts.map(function(p){return p.x;}),ys=pts.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  var mX=(maxX-minX)*0.18||.05,mY=(maxY-minY)*0.18||.05;minX-=mX;maxX+=mX;minY-=mY;maxY+=mY;
  var W=760,H=440,padL=56,padB=54,padT=20,padR=20;var plotW=W-padL-padR,plotH=H-padT-padB;
  function X(v){return padL+((v-minX)/(maxX-minX))*plotW;}
  function Y(v){return padT+plotH-((v-minY)/(maxY-minY))*plotH;}
  var svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="PCoA ordination scatter plot">';
  svg+='<line x1="'+X(0)+'" y1="'+padT+'" x2="'+X(0)+'" y2="'+(padT+plotH)+'" stroke="#EEF4F2"/><line x1="'+padL+'" y1="'+Y(0)+'" x2="'+(W-padR)+'" y2="'+Y(0)+'" stroke="#EEF4F2"/>';
  // group centroids + soft halo
  groups.forEach(function(g){
    var gp=pts.filter(function(p){return p.s.group===g.id;});
    var cx=gp.reduce(function(a,p){return a+p.x;},0)/gp.length,cy=gp.reduce(function(a,p){return a+p.y;},0)/gp.length;
    var rmax=0;gp.forEach(function(p){var dx=X(p.x)-X(cx),dy=Y(p.y)-Y(cy);rmax=Math.max(rmax,Math.sqrt(dx*dx+dy*dy));});
    svg+='<circle cx="'+X(cx)+'" cy="'+Y(cy)+'" r="'+(rmax+14)+'" fill="'+g.color+'" opacity="0.07"/>';
    svg+='<circle cx="'+X(cx)+'" cy="'+Y(cy)+'" r="4" fill="'+g.color+'" opacity="0.5"/>';
  });
  pts.forEach(function(p){var g=groups.filter(function(gg){return gg.id===p.s.group;})[0];svg+='<circle class="beta-dot" data-s="'+esc(p.s.id)+'" data-g="'+esc(g.label)+'" cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="8" fill="'+g.color+'" fill-opacity="0.62" stroke="'+g.color+'" stroke-width="1.8"/>';});
  svg+='<text x="'+(padL+plotW/2)+'" y="'+(H-14)+'" text-anchor="middle" font-size="11.5" fill="#5C6B72">PCo1 · '+pm.pc1+'% of variation</text>';
  svg+='<text x="18" y="'+(padT+plotH/2)+'" transform="rotate(-90 18 '+(padT+plotH/2)+')" text-anchor="middle" font-size="11.5" fill="#5C6B72">PCo2 · '+pm.pc2+'%</text>';
  svg+='</svg>';
  $("#beta-chart").innerHTML=svg;
  $$(".beta-dot").forEach(function(dt){dt.addEventListener("mousemove",function(e){showTip('Sample <b>'+esc(dt.dataset.s)+'</b><br>'+esc(dt.dataset.g),e.clientX,e.clientY);});dt.addEventListener("mouseleave",hideTip);});
  // legend note
  $("#beta-note").innerHTML=groups.map(function(g){return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px"><i style="width:11px;height:11px;border-radius:50%;background:'+g.color+';display:inline-block"></i>'+esc(g.label)+'</span>';}).join("")+' — points close together = similar communities.';
  // stats cards
  var sig=pm.p<0.05;
  var clamp=function(v){return Math.round(Math.max(2,Math.min(98,v))*10)/10;};
  $("#beta-stats").innerHTML=
    statScale("PERMANOVA p-value",pm.p.toFixed(3),{pos:clamp(pm.p*100),thresh:5,threshLabel:"0.05",left:"0 · clear difference",right:"1 · none",interp:(sig?"Below the 0.05 line — the group difference is unlikely to be chance.":"Above 0.05 — no clear group difference.")})+
    statScale("Variation explained (R²)",(pm.R2*100).toFixed(1)+"%",{pos:clamp(pm.R2*100),left:"0% · explains nothing",right:"100% · explains all",interp:"About "+(pm.R2*100).toFixed(0)+"% of community variation tracks the grouping. 10–30% is a typically strong effect for microbiome data."})+
    statScale("Axes shown",(pm.pc1+pm.pc2).toFixed(1)+"%",{pos:clamp(pm.pc1+pm.pc2),left:"little on screen",right:"most on screen",interp:"Share of total variation captured by these two axes; the rest sits on axes not shown. 20–50% is common."});
  var labels=groups.map(function(g){return g.label;}).join(", ");
  var pd=d.sourceStats&&d.sourceStats.permdisp;
  var body=sig
    ? "<p>PERMANOVA is below 0.05, so the groups ("+esc(labels)+") show a detectable whole-community difference in this report.</p>"
    : "<p>PERMANOVA p-value is <strong>"+pm.p.toFixed(3)+"</strong>, so this report does not show a clear whole-community separation between "+esc(labels)+".</p>";
  body+="<p>The grouping accounts for about <strong>"+(pm.R2*100).toFixed(0)+"%</strong> of community variation by the pseudo-F estimate, while the first two PCoA axes show <strong>"+(pm.pc1+pm.pc2).toFixed(1)+"%</strong> of the distance structure.</p>";
  if(pd){body+="<p>PERMDISP p-value is <strong>"+pd.p.toFixed(3)+"</strong>, so dispersion differences are not clear in this example.</p>";}
  $("#beta-read").innerHTML=readbox("What this is telling you",body);
}

/* ---------------- SECTION: functional ---------------- */
function secFunctional(){
  var d=ds();
  var html=head("Function","Predicted Functions",

function fileExtra(name){
  var arr=FILEXTRA[name];if(!arr)return '';
  return '<div class="file-extra"><h5>Additional analysis</h5>'+
    '<div class="fx-guide">Optional next steps you can run on this file. Some need bioinformatics tools and produce hypotheses, not conclusions.</div>'+
    '<div class="fx-grid">'+arr.map(function(x){return '<a class="fx-item" href="'+x.u+'" target="_blank" rel="noopener"><svg class="icon fx-ic" viewBox="0 0 24 24">'+x.i+'</svg><span>'+esc(x.t)+'</span></a>';}).join('')+'</div></div>';
}
function fileSourceStat(f){
  var d=ds(),ss=d.sourceStats||{};
  if(f.stat==="feature"){
    var totals=ss.sampleReadTotals||[];
    var reads=totals.reduce(function(a,x){return a+(x.total||0);},0);
    return "Current source: "+ss.featureRows.toLocaleString()+" ASV rows x "+totals.length+" samples; "+reads.toLocaleString()+" total reads in feature_table.tsv.";
  }
  if(f.stat==="alpha"){
    var vals=d.samples.map(function(s){return s.shannon;}).filter(function(v){return v!=null;});
    return "Current source: "+d.samples.length+" samples; Shannon range "+Math.min.apply(null,vals).toFixed(2)+"-"+Math.max.apply(null,vals).toFixed(2)+".";
  }
  if(f.stat==="beta"){
    var pm=d.permanova.bray,pd=ss.permdisp;
    return "Current source: PERMANOVA p="+pm.p.toFixed(3)+", pseudo-F="+pm.F.toFixed(2)+(pd ? "; PERMDISP p="+pd.p.toFixed(3)+"." : ".");
  }
  if(f.stat==="pcoa"){
    var pm=d.permanova.bray;
    return "Current source: PCoA axes show "+(pm.pc1+pm.pc2).toFixed(1)+"% of Bray-Curtis variation.";
  }
  if(f.stat==="functional"){
    var fs=ss.functionalSummary||{};
    return "Current source: "+(fs.pathway_features||0).toLocaleString()+" pathways, "+(fs.ec_features||0).toLocaleString()+" EC features, mean NSTI "+Number(fs.nsti_mean||0).toFixed(3)+".";
  }
  return "";
}

      rows.map(function(s,i){var y=30+i*28;return '<text x="38" y="'+(y+15)+'" text-anchor="middle" font-size="8" fill="#7C8A90">'+esc(s.id)+'</text><rect x="58" y="'+y+'" width="52" height="22" rx="2" fill="#F7FAFC" stroke="#DDE6EF"/><text x="84" y="'+(y+14)+'" text-anchor="middle" font-size="8" fill="#14232B">'+s.shannon.toFixed(2)+'</text><rect x="116" y="'+y+'" width="54" height="22" rx="2" fill="#FFFFFF" stroke="#DDE6EF"/><text x="143" y="'+(y+14)+'" text-anchor="middle" font-size="8" fill="#14232B">'+s.observed+'</text>';}).join("")+
      '<text x="84" y="112" text-anchor="middle" font-size="7" fill="#7C8A90">Shannon</text><text x="143" y="112" text-anchor="middle" font-size="7" fill="#7C8A90">ASVs</text></svg>';
  }
  if(name==="ordination.qza / pcoa.txt"){
    return '<svg viewBox="0 0 184 126" style="display:block;width:100%;max-width:180px;height:auto" fill="none"><line x1="40" y1="16" x2="40" y2="104" stroke="#DDE6EF"/><line x1="40" y1="104" x2="176" y2="104" stroke="#DDE6EF"/>'+
      d.samples.map(function(s){var x=92+(s.pco.bray[0]*120),y=62-(s.pco.bray[1]*90);var g=d.groups.filter(function(gg){return gg.id===s.group;})[0]||d.groups[0];return '<circle cx="'+Math.max(44,Math.min(172,x))+'" cy="'+Math.max(20,Math.min(100,y))+'" r="4.5" fill="'+g.color+'" fill-opacity="0.65" stroke="'+g.color+'"/>';}).join("")+
      '<text x="108" y="118" text-anchor="middle" font-size="8" fill="#7C8A90">PCoA · '+d.permanova.bray.pc1+'% + '+d.permanova.bray.pc2+'%</text></svg>';
  }
  if(name==="functional_summary.tsv"){
    var fs=ss.functionalSummary||{};
    return '<svg viewBox="0 0 184 118" style="display:block;width:100%;max-width:180px;height:auto" fill="none"><rect x="28" y="18" width="128" height="78" rx="6" fill="#F7FAFC" stroke="#DDE6EF"/>'+
      '<text x="92" y="42" text-anchor="middle" font-size="10" fill="#14232B">'+(fs.pathway_features||0)+' pathways</text><text x="92" y="62" text-anchor="middle" font-size="10" fill="#14232B">'+(fs.ec_features||0)+' EC features</text><text x="92" y="82" text-anchor="middle" font-size="10" fill="#071B3A">NSTI '+Number(fs.nsti_mean||0).toFixed(3)+'</text></svg>';
  }
  return FILEVIZ[name]||"";
}

/* ---------------- SECTION: glossary ---------------- */
var TERMS=[
 {t:"Amplicon",tag:"Method",d:"The specific DNA region copied and sequenced. Here it is a marker gene, not the whole genome."},
 {t:"16S rRNA gene",tag:"Marker",d:"A gene present in all bacteria and archaea with conserved and variable parts, making it the standard barcode for bacterial identification."},
 {t:"ITS region",tag:"Marker",d:"The Internal Transcribed Spacer, the accepted DNA barcode for fungi. ITS1 is one commonly sequenced sub-region."},
 {t:"Full-length 16S",tag:"Marker",d:"A long-read 16S amplicon spans more of the bacterial marker gene than short variable-region assays, improving context for taxonomy assignment."},
 {t:"Primer",tag:"Wet lab",d:"A short DNA sequence that tells the copying reaction where to start and stop, selecting the target region."},
 {t:"Read",tag:"Sequencing",d:"One string of A/C/G/T letters produced by the sequencer, with a quality score for each base."},
 {t:"ASV (Amplicon Sequence Variant)",tag:"Analysis",d:"An exact, error-corrected sequence. ASVs give single-base resolution and have largely replaced 97%-similarity OTUs."},
 {t:"OTU",tag:"Analysis",d:"Operational Taxonomic Unit — an older way of grouping similar sequences into clusters (usually at 97%)."},
 {t:"DADA2",tag:"Software",d:"A denoising method that models sequencing error to recover true ASVs and remove artefacts."},
 {t:"Taxonomy",tag:"Naming",d:"The classification of an organism from kingdom to species. Amplicon calls are most reliable at genus."},
 {t:"Reference database",tag:"Naming",d:"A curated library of known sequences used to name your ASVs. This example reads EMU-derived taxonomy tables from the 1234567890 report folder."},
 {t:"Relative abundance",tag:"Result",d:"The proportion of a sample made up by each taxon. It sums to 100% and does not give absolute cell counts."},
 {t:"Alpha diversity",tag:"Diversity",d:"Diversity within one sample — how many types (richness) and how evenly they are spread (evenness)."},
 {t:"Shannon index",tag:"Diversity",d:"An alpha-diversity score that rewards both richness and evenness; higher means more diverse."},
 {t:"Faith PD",tag:"Diversity",d:"Phylogenetic Diversity — richness that accounts for how related the taxa are. Needs a tree, so it is a 16S metric."},
 {t:"Beta diversity",tag:"Diversity",d:"How different whole communities are from each other, summarised as pairwise distances."},
 {t:"Bray–Curtis",tag:"Diversity",d:"A common distance that compares samples by shared taxa and their abundances."},
 {t:"UniFrac",tag:"Diversity",d:"A distance that also uses the evolutionary tree; 'weighted' includes abundance. Needs a phylogeny."},
 {t:"PCoA",tag:"Visualisation",d:"Principal Coordinates Analysis — projects complex distances onto a 2D map so similar samples sit together."},
 {t:"PERMANOVA",tag:"Statistics",d:"A test for whether groups of samples differ in overall composition more than expected by chance."},
 {t:"Rarefaction",tag:"QC",d:"Levelling every sample to the same read depth so diversity comparisons are fair."},
 {t:"PICRUSt2",tag:"Prediction",d:"A tool that predicts likely gene functions from 16S data. Predictions are hypotheses, not measurements."},
 {t:"Dysbiosis",tag:"Biology",d:"A community shifted away from a typical balanced state, often with lower diversity and more opportunists."}
];
function secGlossary(){
  var html=head("Reference","Glossary",
    "Terms from this report, defined plainly. Search to jump.");
  html+='<div class="card pad"><input class="glossary-search" id="gloss-search" placeholder="Search terms — e.g. Shannon, ASV, primer" aria-label="Search glossary">'+
    '<div id="gloss-list" style="margin-top:8px">'+termList(TERMS)+'</div></div>';
  html+=nextBar();
  return html;
}
function termList(list){
  if(!list.length)return '<p style="padding:16px 0;color:var(--muted)">No terms match that search.</p>';
  return list.map(function(x){return '<div class="term"><b>'+esc(x.t)+'</b><span class="t-tag">'+esc(x.tag)+'</span><p>'+esc(x.d)+'</p></div>';}).join("");
}

  functional:function(){renderFunctional();},
  glossary:function(){var inp=$("#gloss-search");inp.addEventListener("input",function(){var q=inp.value.trim().toLowerCase();var f=TERMS.filter(function(x){return (x.t+" "+x.d+" "+x.tag).toLowerCase().indexOf(q)>=0;});$("#gloss-list").innerHTML=termList(f);});}
};
function showSection(id){
  state.section=id;state.visited[id]=true;

  renderNav();
  wireSectionButtons();
  window.scrollTo({top:0,behavior:"auto"});
}
function wireSectionButtons(){
  $$("[data-sec]",$("#content")).forEach(function(b){b.addEventListener("click",function(){showSection(b.dataset.sec);});});
  $$("[data-assay]",$("#content")).forEach(function(b){b.addEventListener("click",function(){setAssay(b.dataset.assay);});});
  $$("[data-pipe]",$("#content")).forEach(function(b){b.addEventListener("click",function(){state.pipeStep=parseInt(b.dataset.pipe,10);$("#content").innerHTML=RENDER.pipeline();wireSectionButtons();});});
}

/* ---------------- assay / mode / gate wiring ---------------- */
function buildAssaySelect(){
  $("#assay-select").innerHTML=ASSAY_ORDER.map(function(id){return '<option value="'+id+'"'+(id===state.assay?' selected':'')+'>'+esc(assayLabel(id))+'</option>';}).join("");
}
function setAssay(id){
  state.assay=id;buildAssaySelect();
  // reset per-assay chart state that may be invalid
  taxState.focus=null;
  var d=ds();
  if(d.betaMetrics.map(function(m){return m.id;}).indexOf(betaState.metric)<0)betaState.metric=d.betaMetrics[0].id;
  if(d.alphaMetrics.map(function(m){return m.id;}).indexOf(alphaState.metric)<0)alphaState.metric=d.alphaMetrics[0].id;
  updateRailMeta();
  showSection(state.section);
}
function updateRailMeta(){
  var d=ds();var a=ASSAYS[state.assay];
  var site=d.site || "Microbiome";
  $("#rail-title").textContent="Report "+(d.reportCode || "example");
  $("#rail-sub").textContent=site+" · "+d.samples.length+" samples";
  $("#top-report-label").textContent="Report "+(d.reportCode || "example");
}
function enterApp(isDemo){
  $("#gate").style.display="none";
  $("#app").classList.add("on");
  document.body.style.background="#F8FBFE";
  buildAssaySelect();updateRailMeta();renderNav();showSection("welcome");
}

$("#demo-btn").addEventListener("click",function(){enterApp(true);});
$("#code-form").addEventListener("submit",function(e){
  e.preventDefault();
  var v=$("#code").value.trim().toUpperCase();
  var st=$("#gate-status");
  if(!/^[A-Z0-9]{10}$/.test(v)){st.textContent="Enter exactly 10 letters or numbers.";st.className="gate-status err";return;}
  if(v!=="1234567890"){st.textContent="This static example currently includes report 1234567890 only.";st.className="gate-status err";return;}
  st.textContent="Opening report 1234567890.";
  st.className="gate-status";
  setTimeout(function(){enterApp(false);},650);
});

$("#exit-btn").addEventListener("click",function(){$("#app").classList.remove("on");$("#gate").style.display="grid";});

document.addEventListener("click",function(e){
  if(window.innerWidth<=920&&$("#rail").classList.contains("open")){
    if(!e.target.closest("#rail")&&!e.target.closest("#menu-btn"))$("#rail").classList.remove("open");

$("#nav").addEventListener("click",function(e){var b=e.target.closest("[data-sec]");if(b){showSection(b.dataset.sec);if(window.innerWidth<=920)$("#rail").classList.remove("open");}});

petri();
})();
